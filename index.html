<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cloud by Alex</title>
  <meta name="description" content="Cloud by Alex — cloud engineering, DevOps and automation.">
  <style>
    :root{
      --bg:#05101d;
      --bg2:#09192b;
      --text:#f5f9ff;
      --muted:#98acc5;
      --line:rgba(255,255,255,.10);
      --cyan:#78e7ff;
      --blue:#9eabff;
      --green:#7cf0bf;
      --panel:rgba(255,255,255,.045);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;scroll-behavior:smooth}
    body{
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 18%, rgba(120,231,255,.12), transparent 24%),
        radial-gradient(circle at 85% 12%, rgba(158,171,255,.14), transparent 28%),
        radial-gradient(circle at 55% 80%, rgba(120,231,255,.07), transparent 25%),
        linear-gradient(180deg,#040b14 0%,#07131f 45%,#081522 100%);
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none; z-index:-2;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size:56px 56px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), transparent 84%);
    }

    a{text-decoration:none;color:inherit}
    .wrap{width:min(1180px, calc(100% - 40px)); margin:auto}

    nav{
      height:78px;
      display:flex;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,.05);
      background:rgba(4,9,18,.38);
      backdrop-filter:blur(16px);
      position:relative; z-index:20;
    }
    .nav{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      letter-spacing:-.03em;
    }
    .logo{
      width:44px; height:44px;
      border-radius:15px;
      display:grid; place-items:center;
      background:linear-gradient(135deg, rgba(120,231,255,.16), rgba(158,171,255,.22));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:inset 0 0 18px rgba(255,255,255,.03);
    }
    .logo svg{width:24px;height:24px}
    .status{
      font-size:12px;
      color:#d5e2f1;
      padding:9px 13px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
    }
    .status::before{
      content:"";
      display:inline-block;
      width:8px; height:8px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 14px rgba(124,240,191,.9);
      margin-right:8px;
    }

    main{
      min-height:calc(100vh - 78px);
      display:flex;
      align-items:center;
      padding:56px 0 70px;
    }
    .hero{
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:54px;
      align-items:center;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-bottom:20px;
      font-size:13px;
      font-weight:700;
      letter-spacing:.05em;
      color:#dffbff;
    }
    .eyebrow::before{
      content:"";
      width:28px; height:1px;
      background:linear-gradient(90deg,var(--cyan),transparent);
    }

    h1{
      margin:0;
      font-size:clamp(60px,8vw,108px);
      line-height:.9;
      letter-spacing:-.075em;
    }
    .grad{
      background:linear-gradient(100deg,#ffffff 15%, #a6f3ff 48%, #bcc3ff 84%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .sub{
      max-width:560px;
      margin:24px 0 28px;
      color:var(--muted);
      font-size:18px;
      line-height:1.72;
    }
    .tags,.actions{display:flex; flex-wrap:wrap; gap:10px}
    .tags{margin-bottom:30px}
    .tag{
      padding:8px 11px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
      color:#d1ddec;
      font-size:12px;
    }
    .btn{
      padding:14px 18px;
      border-radius:15px;
      font-size:14px;
      font-weight:760;
      transition:.2s ease;
    }
    .btn:hover{transform:translateY(-2px)}
    .primary{
      color:#06111b;
      background:linear-gradient(135deg,#c9f9ff,#aab5ff);
      box-shadow:0 18px 38px rgba(120,231,255,.12);
    }
    .secondary{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:#edf3fb;
    }

    .visual{
      position:relative;
      height:560px;
      display:grid;
      place-items:center;
    }

    .ambient-glow{
      position:absolute;
      width:440px; height:440px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(120,231,255,.14), rgba(158,171,255,.07) 45%, transparent 72%);
      filter:blur(18px);
      animation:breathe 6s ease-in-out infinite;
    }

    .soft-cloud{
      position:relative;
      width:420px;
      height:250px;
      z-index:3;
      animation:floatCloud 7s ease-in-out infinite;
    }

    .cloud-body{
      position:absolute;
      inset:0;
      filter:drop-shadow(0 30px 70px rgba(0,0,0,.28));
    }

    .puff{
      position:absolute;
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.98) 0%, rgba(225,244,255,.92) 42%, rgba(180,219,255,.78) 72%, rgba(170,210,255,.40) 100%);
      border-radius:50%;
      box-shadow:
        inset 0 10px 35px rgba(255,255,255,.28),
        0 0 40px rgba(149,214,255,.18);
    }

    .p1{width:120px;height:120px;left:28px;top:78px}
    .p2{width:165px;height:165px;left:78px;top:42px}
    .p3{width:150px;height:150px;left:180px;top:54px}
    .p4{width:118px;height:118px;right:38px;top:86px}
    .p5{width:290px;height:120px;left:72px;bottom:28px;border-radius:60px}

    .cloud-sheen{
      position:absolute;
      left:68px; top:58px;
      width:225px; height:68px;
      border-radius:999px;
      background:linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0));
      filter:blur(8px);
      opacity:.75;
      z-index:2;
    }

    .alex-chip{
      position:absolute;
      left:50%;
      top:56%;
      transform:translate(-50%,-50%);
      z-index:5;
      padding:12px 20px;
      border-radius:999px;
      background:rgba(255,255,255,.22);
      border:1px solid rgba(255,255,255,.30);
      backdrop-filter:blur(10px);
      box-shadow:0 18px 40px rgba(72,132,170,.16);
      font-weight:900;
      letter-spacing:.18em;
      font-size:18px;
      color:#153247;
      text-transform:uppercase;
    }

    .mini{
      position:absolute;
      z-index:6;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(6,13,26,.78);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      color:#cad7e8;
      font:11px ui-monospace,SFMono-Regular,Menlo,monospace;
      box-shadow:0 18px 45px rgba(0,0,0,.22);
      animation:floatMini 6s ease-in-out infinite;
    }
    .mini b{color:#fff}
    .ok{color:var(--green)}
    .m1{left:12px;top:96px}
    .m2{right:8px;top:156px;animation-delay:-2s}
    .m3{left:72px;bottom:80px;animation-delay:-4s}

    .fog{
      position:absolute;
      background:rgba(255,255,255,.08);
      border-radius:999px;
      filter:blur(10px);
      animation:drift 10s ease-in-out infinite;
      z-index:1;
    }
    .fog::before,.fog::after{
      content:"";
      position:absolute;
      background:inherit;
      border-radius:50%;
    }
    .f1{width:110px;height:34px;left:50px;top:34px}
    .f1::before{width:38px;height:38px;left:18px;top:-14px}
    .f1::after{width:50px;height:50px;right:16px;top:-22px}
    .f2{width:90px;height:30px;right:44px;bottom:48px;animation-delay:-4s}
    .f2::before{width:32px;height:32px;left:14px;top:-12px}
    .f2::after{width:40px;height:40px;right:12px;top:-18px}

    @keyframes breathe{
      0%,100%{transform:scale(.98);opacity:.8}
      50%{transform:scale(1.04);opacity:1}
    }
    @keyframes floatCloud{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-12px)}
    }
    @keyframes floatMini{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }
    @keyframes drift{
      0%,100%{transform:translateX(0)}
      50%{transform:translateX(14px)}
    }

    @media (max-width:930px){
      .hero{grid-template-columns:1fr}
      .visual{height:500px}
    }

    @media (max-width:600px){
      .wrap{width:min(100% - 24px, 1180px)}
      .status{display:none}
      main{padding:40px 0 56px}
      h1{font-size:clamp(54px,18vw,80px)}
      .sub{font-size:16px}
      .visual{height:400px}
      .ambient-glow{width:320px;height:320px}
      .soft-cloud{width:300px;height:190px}
      .p1{width:84px;height:84px;left:16px;top:68px}
      .p2{width:120px;height:120px;left:52px;top:34px}
      .p3{width:110px;height:110px;left:132px;top:44px}
      .p4{width:82px;height:82px;right:20px;top:78px}
      .p5{width:210px;height:90px;left:46px;bottom:18px}
      .cloud-sheen{left:44px;top:44px;width:165px;height:50px}
      .alex-chip{font-size:14px;padding:9px 14px}
      .mini{font-size:10px;padding:8px 10px}
      .m1{left:0;top:70px}
      .m2{right:0;top:124px}
      .m3{left:22px;bottom:48px}
    }

    @media (prefers-reduced-motion: reduce){
      *{animation:none!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <nav>
    <div class="wrap nav">
      <a class="brand" href="#">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#78e7ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17h10a4 4 0 0 0 .5-8A6 6 0 0 0 6.2 10 3.5 3.5 0 0 0 7 17Z"/>
          </svg>
        </span>
        <span>cloudbyalex</span>
      </a>
      <div class="status">cloud portfolio</div>
    </div>
  </nav>

  <main>
    <div class="wrap hero">
      <section>
        <div class="eyebrow">CLOUD ∞ DEVOPS</div>
        <h1><span class="grad">Cloud.</span><br>By Alex.</h1>
        <p class="sub">
          Cloud engineering and DevOps focused on reliable infrastructure,
          automation and clean delivery.
        </p>
        <div class="tags">
          <span class="tag">AWS</span>
          <span class="tag">Kubernetes</span>
          <span class="tag">Terraform</span>
          <span class="tag">CI/CD</span>
        </div>
        <div class="actions">
          <a class="btn primary" href="mailto:alex@example.com">Contact →</a>
          <a class="btn secondary" href="#">Resume</a>
        </div>
      </section>

      <section class="visual" aria-label="Soft cloud illustration with Alex name">
        <div class="fog f1"></div>
        <div class="fog f2"></div>
        <div class="ambient-glow"></div>

        <div class="soft-cloud">
          <div class="cloud-body">
            <div class="puff p1"></div>
            <div class="puff p2"></div>
            <div class="puff p3"></div>
            <div class="puff p4"></div>
            <div class="puff p5"></div>
            <div class="cloud-sheen"></div>
          </div>
          <div class="alex-chip">ALEX</div>
        </div>

        <div class="mini m1"><b>terraform</b> <span class="ok">applied</span></div>
        <div class="mini m2"><b>cloud</b> <span class="ok">ready</span></div>
        <div class="mini m3"><b>pipeline</b> <span class="ok">passed</span></div>
      </section>
    </div>
  </main>
</body>
</html>
