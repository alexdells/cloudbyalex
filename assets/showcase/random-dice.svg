<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" role="img" aria-label="Floating three-dimensional dice and a luminous coin">
<defs>
<radialGradient id="neb"><stop stop-color="#9352fc" stop-opacity=".54"/><stop offset="1" stop-color="#382a8b" stop-opacity="0"/></radialGradient>
<linearGradient id="violetTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4baff"/><stop offset=".45" stop-color="#b779ff"/><stop offset="1" stop-color="#744de7"/></linearGradient>
<linearGradient id="violetLeft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bb89ff"/><stop offset=".6" stop-color="#6e40cb"/><stop offset="1" stop-color="#34239b"/></linearGradient>
<linearGradient id="violetRight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d5eff"/><stop offset="1" stop-color="#3d237f"/></linearGradient>
<linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6f9ff"/><stop offset="1" stop-color="#729cfb"/></linearGradient>
<linearGradient id="blueSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86caff"/><stop offset="1" stop-color="#3656c5"/></linearGradient>
<linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6fdff"/><stop offset=".25" stop-color="#86d5ff"/><stop offset=".6" stop-color="#587fe2"/><stop offset="1" stop-color="#eefaff"/></linearGradient>
<filter id="dshadow" x="-60%" y="-65%" width="220%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
